# Local demonstration: publish only Django on loopback and skip TLS Nginx.
# Use together with docker-compose.yml; never use this override for a public deployment.
services:
  web:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: dbt_platform.settings
      # Load the large embedding model only when semantic search is used.
      EMBEDDING_PRELOAD: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      EXTERNAL_BASE_URL: "http://localhost:8000"

  nginx:
    profiles: ["production"]

  minio:
    image: bitnamilegacy/minio:2025.6.13-debian-12-r2
    command: null
    volumes:
      - minio_data:/bitnami/minio/data
